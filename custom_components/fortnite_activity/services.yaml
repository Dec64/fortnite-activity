start_session:
  name: Start Session
  description: Manually start an active gaming session for a player.
  fields:
    player_id:
      name: Player Identifier
      description: Identifier of the player (e.g. player1).
      required: true
      example: "player1"
      selector:
        text:

end_session:
  name: End Session
  description: Manually end the active gaming session for a player and archive it to history.
  fields:
    player_id:
      name: Player Identifier
      description: Identifier of the player (e.g. player1).
      required: true
      example: "player1"
      selector:
        text:

refresh_player:
  name: Refresh Stats
  description: Immediately poll api-fortnite.com for fresh stats and match updates.
  fields:
    player_id:
      name: Player Identifier
      description: Identifier of the player (e.g. player1). If omitted, refreshes all players.
      required: false
      example: "player1"
      selector:
        text:

set_avatar:
  name: Set Avatar
  description: Use one of the player's owned outfits (from the linked Epic account) as their avatar on the card. Leave the outfit empty to clear it.
  fields:
    player_id:
      name: Player Identifier
      description: Identifier of the player (e.g. player1).
      required: true
      example: "player1"
      selector:
        text:
    outfit_id:
      name: Outfit ID
      description: Owned outfit id (as listed in the card's Locker section). Empty clears the avatar.
      required: false
      example: "cid_028_athena_commando_f"
      selector:
        text:

wishlist_add:
  name: Add to Wishlist
  description: Add a cosmetic to a player's wishlist. When it appears in the Item Shop the Wishlist sensor lists it and a fortnite_activity_wishlist_in_shop event fires.
  fields:
    player_id:
      name: Player Identifier
      required: true
      example: "player1"
      selector:
        text:
    cosmetic_id:
      name: Cosmetic ID
      description: Cosmetic id from the card's skin browser (e.g. character_xyz).
      required: true
      selector:
        text:

wishlist_remove:
  name: Remove from Wishlist
  description: Remove a cosmetic from a player's wishlist.
  fields:
    player_id:
      name: Player Identifier
      required: true
      example: "player1"
      selector:
        text:
    cosmetic_id:
      name: Cosmetic ID
      required: true
      selector:
        text:

set_favorite:
  name: Set Favourite Outfit
  description: Mark (or unmark) an owned outfit as a favourite in the Locker.
  fields:
    player_id:
      name: Player Identifier
      required: true
      example: "player1"
      selector:
        text:
    outfit_id:
      name: Outfit ID
      required: true
      selector:
        text:
    favorite:
      name: Favourite
      required: false
      default: true
      selector:
        boolean:
